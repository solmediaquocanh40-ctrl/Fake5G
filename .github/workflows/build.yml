name: Build Fake5G 1.1.1

on:
  push:
  workflow_dispatch:

jobs:
  build:
    name: Build (${{ matrix.scheme }})
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        scheme: [rootless, rootful, roothide]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install ldid
        run: brew install ldid

      - name: Clone Theos
        run: |
          if [ "${{ matrix.scheme }}" = "roothide" ]; then
            REPO=https://github.com/roothide/theos.git
          else
            REPO=https://github.com/theos/theos.git
          fi
          git clone --recursive "$REPO" "$HOME/theos"
          echo "THEOS=$HOME/theos" >> "$GITHUB_ENV"

      - name: Install iOS SDK
        run: |
          git clone --depth 1 --filter=blob:none --sparse https://github.com/theos/sdks.git /tmp/sdks
          cd /tmp/sdks
          git sparse-checkout set iPhoneOS16.5.sdk
          mv iPhoneOS16.5.sdk "$THEOS/sdks/"

      - name: Build package
        run: |
          export THEOS="$HOME/theos"
          if [ "${{ matrix.scheme }}" = "rootful" ]; then
            make package FINALPACKAGE=1
          else
            make package FINALPACKAGE=1 THEOS_PACKAGE_SCHEME=${{ matrix.scheme }}
          fi

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: Fake5G-1.1.1-${{ matrix.scheme }}
          path: packages/*.deb
